[project]
name = "tech-challenge-fase-2"
version = "0.1.0"
description = "Scaffold de projeto de Machine Learning com Python, Scikit-Learn e MLflow"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "scikit-learn>=1.5,<1.6",
    "mlflow-skinny>=2.16,<3.0",
    "pandas>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "imbalanced-learn>=0.12,<0.13",
    "numpy>=1.26,<3.0",
    "loguru>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "dvc>=3.0,<4.0",
]
notebook = [
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.12,<1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true
